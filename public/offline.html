<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07140d" />
    <title>WACRM — Sem conexão</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #07140d; color: #f4fff7; }
      main { width: min(100%, 420px); text-align: center; }
      .mark { width: 72px; height: 72px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 18px; background: #25d366; color: #062b17; }
      h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.02em; }
      p { margin: 12px auto 24px; max-width: 34ch; color: #a8c9b2; line-height: 1.55; }
      button { min-height: 48px; border: 0; border-radius: 12px; padding: 0 20px; background: #25d366; color: #062b17; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
      </div>
      <h1>Você está sem conexão</h1>
      <p>O WACRM precisa da internet para sincronizar conversas e contatos. Reconecte-se e tente novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
